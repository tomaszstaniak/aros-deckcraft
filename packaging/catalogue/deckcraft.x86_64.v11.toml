id              = "deckcraft"
version         = "0.18.1"
summary         = "Presentation program for PPTX with slide show and PDF export"
category        = "office/presentation"
license         = "MIT OR Apache-2.0"
kind            = "app"
arch            = "x86_64"
abi             = "v11"
subdir          = "DeckCraft"
icon            = "DeckCraft.info"
depends         = []
depends_checked = true
post_install_notes = [
  "x86_64 ABIv11 distributions; tested on AROS One 1.3.",
  "The CPU renderer redraws only the parts of the window that changed; scrolling, zooming and other changes of the whole window are slower on slow machines.",
  "GUI_RENDERER ToolType: AUTO (default), CPU or GPU. AUTO uses OpenGL only when it is not Mesa software OpenGL.",
  "Settings, AutoRecover data and DeckCraft.log are kept in DeckCraftData in the program drawer; keep it when upgrading.",
  "Media plays without sound. No printing: export to PDF instead. Updates come through the AROS package manager.",
]

# System libraries the programs open: C runtime first, then window, pictures and requesters.

[[requires_system]]
type = "library"
id   = "crt.library"

[[requires_system]]
type = "library"
id   = "stdlib.library"

[[requires_system]]
type = "library"
id   = "m.library"

[[requires_system]]
type = "library"
id   = "cybergraphics.library"

[[requires_system]]
type = "library"
id   = "iffparse.library"

[[requires_system]]
type = "library"
id   = "asl.library"

[[requires_system]]
type = "library"
id   = "datatypes.library"

[source]
repository = "https://github.com/tomaszstaniak/aros-deckcraft"
revision   = "v0.18.1"
archive    = "DeckCraft-0.18.1-source.zip"
built_with = "x86_64 ABIv11, GCC 10.5.0, Rust nightly 1.100 (rust-aros), egui 0.37 through egui-aros"

[launch]
executable = "DeckCraft"
mode       = "workbench"
